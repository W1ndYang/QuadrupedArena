name: CPU rules and portability
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-cpu.txt
      - run: python -m pip install -r requirements-cpu.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python scripts/cpu_demo.py
      - run: bash run.sh --help

      - name: Fixed-goal v0.4.1 referee tests (no API / Isaac)
        run: python -m unittest discover -s benchmarks/fixed_goal_v041/source_snapshot/scripts -p 'test_fixed_goal_probe.py' -v
      - name: Goal-only stun and terminal rules
        run: python -m unittest discover -s benchmarks/fixed_goal_v041 -p 'test_v041_rules.py' -v
      - name: Audit published fixed-goal observations and decisions
        run: python benchmarks/fixed_goal_v041/benchmark.py audit
      - name: Replay all three fixed-goal games without API calls
        run: python benchmarks/fixed_goal_v041/benchmark.py replay --output .arena-workspace/ci-fixed-goal
      - name: Verify six-game lightweight showcase integrity (no API / Isaac)
        run: python benchmarks/fixed_goal_v05_showcase/verify.py

      # Independent of the earlier steps, so a failure there does not hide this module's result.
      - name: Breach Arena tests (isolated module; no API / Isaac / pygame)
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s breach_arena/tests -t . -v
      - name: Breach Arena play / counter-play matrix (deterministic)
        if: ${{ !cancelled() }}
        run: |
          python -m breach_arena matrix --map BA-1
          python -m breach_arena matrix --map BA-2
