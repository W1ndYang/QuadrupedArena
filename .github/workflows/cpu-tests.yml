name: CPU rules and portability
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-cpu.txt
      - run: python -m pip install -r requirements-cpu.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python scripts/cpu_demo.py
      - run: bash run.sh --help
